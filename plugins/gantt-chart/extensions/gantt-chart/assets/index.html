<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Gantt chart</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="start" class="start" hidden></div>
  <div id="editor" class="editor" hidden>
    <header id="topbar" class="topbar"></header>
    <div id="toolbar" class="toolbar" role="toolbar"></div>
    <div id="banner" class="banner" role="alert" hidden></div>
    <div class="main">
      <div id="scroller" class="scroller">
        <div id="grid" class="grid">
          <div id="hl" class="hl"></div>
          <div id="ht" class="ht"></div>
          <div id="bl" class="bl" role="treegrid" tabindex="0"></div>
          <div id="bt" class="bt"></div>
        </div>
      </div>
      <div id="empty" class="empty" hidden></div>
      <div id="splits" class="splits" hidden></div>
      <div class="fabs">
        <button id="fit" class="fab" type="button"></button>
        <button id="today" class="fab" type="button"></button>
      </div>
    </div>
    <div id="psplit" class="hsplit" role="separator" aria-orientation="horizontal" tabindex="0" hidden></div>
    <aside id="panel" class="panel" hidden></aside>
    <footer id="status" class="status" role="status"></footer>
  </div>
  <dialog id="project" class="dlg" aria-labelledby="project-title"></dialog>
  <dialog id="versions" class="dlg" aria-labelledby="versions-title"></dialog>
  <dialog id="confirm" class="dlg" aria-labelledby="confirm-text"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="tip" class="tip" hidden></div>
  <div id="ctx" class="ctx" role="menu" hidden></div>
  <div id="suggest" class="suggest" role="listbox" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
